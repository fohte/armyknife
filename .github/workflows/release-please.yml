on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to upload assets to (e.g., v0.1.1)'
        required: true
        type: string

name: release-please

jobs:
  release-please:
    concurrency:
      group: release-please-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          identity: ${{ github.event.repository.name }}-release-please
          domain: octo-sts.fohte.net

      - name: Record default branch HEAD
        id: base
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          SHA=$(gh api "repos/${{ github.repository }}/commits/$TARGET_BRANCH" --jq .sha)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Close stale release PR
        id: stale
        if: steps.release.outputs.prs_created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
          CURRENT_BASE_SHA=$(gh api "repos/${{ github.repository }}/commits/$TARGET_BRANCH" --jq .sha)

          if [[ "$CURRENT_BASE_SHA" == "$BASE_SHA" ]]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "The default branch has not changed since release-please started"
            exit 0
          fi

          # Aggregate compare files omit paths reverted within the commit range.
          BASE_COMMIT_SHAS=$(gh api --paginate \
            "repos/${{ github.repository }}/compare/$BASE_SHA...$CURRENT_BASE_SHA" \
            | jq -r '.commits[].sha')
          if [[ -z "$BASE_COMMIT_SHAS" ]]; then
            echo "The default branch advanced but the comparison returned no commits"
            exit 1
          fi

          BRANCH_FILES=$(
            while IFS= read -r COMMIT_SHA; do
              gh api "repos/${{ github.repository }}/commits/$COMMIT_SHA" \
                | jq -r '.files[].filename' \
                || exit 1
            done <<< "$BASE_COMMIT_SHAS" | jq -R -s 'split("\n") | map(select(length > 0)) | unique'
          )
          PR_FILES=$(gh api \
            "repos/${{ github.repository }}/pulls/$PR_NUMBER/files?per_page=100" \
            | jq '[.[].filename] | unique')
          OVERLAP=$(jq -cn \
            --argjson branch_files "$BRANCH_FILES" \
            --argjson pr_files "$PR_FILES" \
            '$branch_files | map(select(. as $file | $pr_files | index($file)))')

          if [[ "$OVERLAP" == "[]" ]]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Release PR changes do not overlap with changes since the recorded master HEAD"
            exit 0
          fi

          echo "stale=true" >> "$GITHUB_OUTPUT"
          FILE_LIST=$(echo "$OVERLAP" | jq -r 'join(", ")')
          gh pr comment "$PR_NUMBER" -R "${{ github.repository }}" --body "This release PR was created from an older view of $TARGET_BRANCH. While release-please was running, $TARGET_BRANCH advanced with changes to files this PR also updates: $FILE_LIST. I am closing this PR so the queued release-please run can recreate it from the latest $TARGET_BRANCH."
          gh pr close "$PR_NUMBER" -R "${{ github.repository }}"
          echo "::warning::Closed stale release PR $PR_NUMBER because its changes overlap with $TARGET_BRANCH updates: $FILE_LIST"

      # Auto-merge release PR to enable automatic releases on every merge to master
      - name: Auto-merge release PR
        if: steps.release.outputs.prs_created == 'true' && steps.stale.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
          # Try --auto first (enables auto-merge when CI is pending/required)
          # If PR is already in clean or unstable status, --auto cannot be enabled
          # and required checks have passed, so fall back to direct merge.
          if OUTPUT=$(gh pr merge "$PR_NUMBER" --squash --auto -R "${{ github.repository }}" 2>&1); then
            echo "$OUTPUT"
            echo "Auto-merge enabled successfully"
          elif echo "$OUTPUT" | grep -Eq "(clean|unstable) status"; then
            echo "$OUTPUT"
            echo "PR is ready to merge, merging directly"
            gh pr merge "$PR_NUMBER" --squash -R "${{ github.repository }}"
          else
            echo "$OUTPUT"
            echo "Auto-merge failed with unexpected error"
            exit 1
          fi

          # Keep the merge inside the serialized job so the next run cannot
          # update the release branch while GitHub is merging the PR.
          for ((attempt = 1; attempt <= 90; attempt++)); do
            PR_STATE=$(gh pr view "$PR_NUMBER" --json state --jq .state -R "${{ github.repository }}")
            if [[ "$PR_STATE" == "MERGED" ]]; then
              echo "Release PR merged successfully"
              exit 0
            fi
            if [[ "$PR_STATE" == "CLOSED" ]]; then
              echo "Release PR was closed without being merged"
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for release PR to merge"
          exit 1

  build-release:
    needs: release-please
    # always() is required because release-please job is skipped on workflow_dispatch,
    # and dependent jobs skip without evaluating their if condition by default.
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_SKIP_CACHE_CHECK: 'true'
      RUSTC_WRAPPER: 'sccache'
      SCCACHE_LOG: 'debug'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name || needs.release-please.outputs.tag_name }}

      - run: rustup show

      - run: rustup target add ${{ matrix.target }}

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.9

      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          mise reshim

      - name: Install agent-watch-web dependencies
        run: cd agent-watch-web && pnpm install --frozen-lockfile

      - name: Build agent-watch-web
        run: cd agent-watch-web && pnpm run build

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../armyknife-${{ matrix.target }}.tar.gz a

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name || needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            armyknife-${{ matrix.target }}.tar.gz
