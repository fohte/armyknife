name: Test

on:
  push:
    branches-ignore:
      # Skip release-please branches (Release PRs) since they only update CHANGELOG and version
      - release-please--branches--*

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'

    steps:
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          identity: ${{ github.event.repository.name }}
          domain: octo-sts.fohte.net

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check if current commit is auto-format by bot
        id: check-auto-format
        run: |
          commit_message=$(git log -1 --format=%s)
          commit_author=$(git log -1 --format=%an)
          echo "Current commit message: $commit_message"
          echo "Current commit author: $commit_author"

          # Skip if the current commit is an auto-format commit by a bot
          # to prevent infinite loop: auto-format push -> CI -> auto-format push -> ...
          if [ "$commit_message" = "style: auto-format" ] && [[ "$commit_author" == *"[bot]"* ]]; then
            echo "skip_commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_commit=false" >> "$GITHUB_OUTPUT"
          fi

      # Run rustup before mise-action to prevent race condition.
      # Multiple cargo: tools in mise.toml trigger parallel rustup component downloads,
      # causing "could not rename downloaded file" errors.
      - run: rustup show

      # Run sccache-action before mise-action so that sccache binary is
      # available when mise installs cargo tools (RUSTC_WRAPPER=sccache).
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14

      # corepack creates the pnpm executable inside mise's node install bin
      # directory; reshim so the mise shims dir (which is on PATH) picks it up.
      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          store_path=$(pnpm store path)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('agent-watch-web/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install pnpm dependencies (agent-watch-web)
        run: cd "agent-watch-web" && pnpm install --frozen-lockfile

      - name: Check peer dependencies (agent-watch-web)
        run: cd "agent-watch-web" && pnpm peers check

      - run: cargo fetch

      - name: Run lefthook
        id: lefthook
        continue-on-error: true
        env:
          # pinact's min-age check calls the GitHub API; without a token it hits
          # the 60 req/h unauthenticated limit shared per IP and fails on CI.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: lefthook run pre-commit --all-files

      # Formatters configured with `stage_fixed: true` run `git add` after formatting,
      # which stages the changes.
      # commit-action uses `git ls-files --modified` which only detects unstaged changes.
      # https://github.com/suzuki-shunsuke/commit-action/blob/87b297f0ce551411b43d1880f4fb3cbc60381055/action.yaml#L57
      # We need to unstage the changes so commit-action can detect them.
      - name: Unstage changes for commit-action
        run: git restore --staged .

      - name: Commit formatted files
        if: ${{ !cancelled() && steps.check-auto-format.outputs.skip_commit != 'true' }}
        uses: suzuki-shunsuke/commit-action@06e3b49d4706498d325d29bd85adc82ecf2f5d8f # v1.0.0
        with:
          commit_message: 'style: auto-format'
          workflow: deny
          github_token: ${{ steps.octo-sts.outputs.token }}

      - name: Fail if lefthook failed
        if: steps.lefthook.outcome == 'failure'
        run: exit 1

      - name: Regenerate config schema
        run: cargo run -p config-schema-gen -- docs/config-schema.json

  unit-test-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: rustup show

      # Run sccache-action before mise-action so that sccache binary is
      # available when mise installs cargo tools (RUSTC_WRAPPER=sccache).
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Install srt dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep

      # Ubuntu 26.04's apparmor package loads this profile by default. Its
      # unpriv_bwrap child denies CAP_SYS_ADMIN needed by apply-seccomp in a
      # nested user namespace; the sysctl below cannot override that denial.
      - name: Unload Bubblewrap AppArmor profile
        run: sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict

      - name: Enable unprivileged user namespaces
        run: |
          # Ubuntu restricts capabilities in unprivileged user namespaces.
          # After unloading the Bubblewrap profile above, bwrap runs unconfined
          # and this sysctl allows it and apply-seccomp to retain the required
          # capabilities in nested user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Build outside sandbox (needs network for crates.io), run tests inside sandbox.
      # This catches filesystem side effects while allowing normal dependency resolution.
      - name: Build tests with coverage instrumentation
        run: |
          # Set RUSTFLAGS and LLVM_PROFILE_FILE for coverage instrumentation.
          # shellcheck source=/dev/null
          source <(cargo llvm-cov show-env --export-prefix)
          cargo build --tests --all-features --workspace

      - name: Run tests in sandbox
        run: |
          # Set LLVM_PROFILE_FILE so test binaries write .profraw files to the correct location.
          # shellcheck source=/dev/null
          source <(cargo llvm-cov show-env --export-prefix)
          # srt hardcodes TMPDIR=/tmp/claude in sandbox-utils.ts:
          # https://github.com/anthropic-experimental/sandbox-runtime/blob/dcf3f91/src/sandbox/sandbox-utils.ts#L335
          # The directory doesn't exist by default, so create it for TempDir::new() to work.
          mkdir -p /tmp/claude
          srt --settings ./srt-settings.json cargo test --all-features --workspace

      - name: Generate coverage report
        run: |
          # Set env vars so cargo llvm-cov report can find the .profraw files.
          # shellcheck source=/dev/null
          source <(cargo llvm-cov show-env --export-prefix)
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  unit-test-agent-watch-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14

      # corepack creates the pnpm executable inside mise's node install bin
      # directory; reshim so the mise shims dir (which is on PATH) picks it up.
      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          store_path=$(pnpm store path)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('agent-watch-web/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: cd "agent-watch-web" && pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        working-directory: agent-watch-web
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: agent-watch-web
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: agent-watch-web
        run: pnpm exec playwright install-deps chromium

      - name: Run tests
        working-directory: agent-watch-web
        run: pnpm run test

      - name: Build app
        working-directory: agent-watch-web
        run: pnpm run build

  # Fixed name for branch protection: per-package job names are dynamic, and
  # knip has no `needs`, so this gate (skip == success) stands in for both.
  unit-test:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    needs:
      - unit-test-run
      - unit-test-agent-watch-web
      - knip
    if: failure()
    steps:
      - run: exit 1

  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14

      # corepack creates the pnpm executable inside mise's node install bin
      # directory; reshim so the mise shims dir (which is on PATH) picks it up.
      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          store_path=$(pnpm store path)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('agent-watch-web/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install pnpm dependencies (agent-watch-web)
        run: cd "agent-watch-web" && pnpm install --frozen-lockfile

      - name: Run knip (agent-watch-web)
        run: cd "agent-watch-web" && pnpm exec knip

      - name: Run knip in production mode (agent-watch-web)
        run: cd "agent-watch-web" && pnpm exec knip --production
