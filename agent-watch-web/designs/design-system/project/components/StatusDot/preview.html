<!-- @dsCard group="Status" height=64 subtitle="static rendition" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StatusDot</title>
</head>
<body>
<div class="aw-row">
  <span class="aw-status-dot" data-status="unread" aria-label="Needs action, unread"></span><span class="aw-note">unread</span>
  <span class="aw-status-dot" data-status="working" aria-label="In progress"></span><span class="aw-note">working</span>
  <span class="aw-status-dot" data-status="working" data-layout="mobile" aria-label="In progress"></span><span class="aw-note">working, mobile inbox</span>
  <span class="aw-status-dot" data-status="done" aria-label="Done"></span><span class="aw-note">done</span>
  <span class="aw-status-dot" aria-label="Needs action"></span><span class="aw-note">read</span>
</div>
</body>
</html>
