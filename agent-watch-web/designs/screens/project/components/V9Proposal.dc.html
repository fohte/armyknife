<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proposal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1200px; height: 900px; display: flex; flex-direction: column; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.55">

<header style="height: 56px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid #2a2a2a">
<div style="min-width: 0">
<div style="display: flex; gap: 10px; font-size: 12px; color: #8b8b94"><span style="color: #d4d4d8"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 700">P4 #207</span> 通知の許可を求める</span><span style="font-family: 'JetBrains Mono', monospace">fohte/tq</span><span>↑ Parent: tq PM</span></div>
<h1 style="margin: 0; font-size: 15px; font-weight: 700">通知の許可ダイアログ</h1>
</div>
<div style="margin-left: auto; display: flex; gap: 6px"><button type="button" style="height: 28px; padding: 0 10px; border: 1px solid #2a2a2a; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 12px">Later</button><button type="button" style="height: 28px; padding: 0 10px; border: 1px solid #2a2a2a; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 12px">Open in terminal</button></div>
</header>

<div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end">
<div style="width: 100%; max-width: 880px; box-sizing: border-box; margin: 0 auto; padding: 0 24px 24px; display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; color: #d4d4d8">Push 通知の購読処理はできました。許可を求めるタイミングで 2 つの案があるので、選んでもらってから画面を作ります。</p>

<section aria-label="Proposal" style="border: 1px solid #fbbf24">
<div style="padding: 14px 18px 10px">
<div style="font-size: 12px; font-weight: 700; color: #fbbf24">Proposal · waiting for your choice</div>
<h2 style="margin: 4px 0 0; font-size: 17px; font-weight: 700">通知の許可を、どのタイミングで求めるか</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #a1a1aa">iOS の PWA は一度断られると、設定アプリからしか戻せない。</p>
</div>
<div role="radiogroup" aria-label="Options" style="display: grid; grid-template-columns: 1fr; gap: 8px; padding: 0 18px 14px">
<label style="display: block; padding: 14px; background: #141414; outline: 2px solid #fafafa; outline-offset: -2px; cursor: pointer">
<span style="display: flex; align-items: center; gap: 8px"><input type="radio" name="opt" checked style="accent-color: #fafafa"><b style="font-size: 15px">A · 先に用途を説明する</b><span style="margin-left: auto; padding: 0 6px; font-size: 11px; border: 1px solid #a1a1aa; color: #d4d4d8">Recommended</span></span>
<span style="display: block; margin-top: 8px; font-size: 13px; color: #d4d4d8">タスクの期限が近づいたら知らせる、と 1 枚の画面で説明してから OS のダイアログを出す。</span>
<span style="display: block; margin-top: 8px; font-size: 12.5px; color: #a1a1aa">+ 断られにくい<br>+ 断られても次の機会に出し直せる<br>− 画面が 1 枚増える</span>
</label>
<label style="display: block; padding: 14px; background: #141414; cursor: pointer">
<span style="display: flex; align-items: center; gap: 8px"><input type="radio" name="opt" style="accent-color: #fafafa"><b style="font-size: 15px">B · すぐに OS のダイアログ</b></span>
<span style="display: block; margin-top: 8px; font-size: 13px; color: #d4d4d8">初回起動時にそのまま OS の許可ダイアログを出す。</span>
<span style="display: block; margin-top: 8px; font-size: 12.5px; color: #a1a1aa">+ 実装が小さい<br>− 用途が分からず断られやすい<br>− 断られると戻せない</span>
</label>
</div>
<div style="padding: 0 18px 14px">
<label style="display: block"><span style="display: block; margin-bottom: 4px; font-size: 12px; color: #8b8b94">Comment (optional)</span>
<textarea rows="2" placeholder="例: A で。説明の画面は設定からも開けるように" style="display: block; width: 100%; box-sizing: border-box; resize: none; padding: 8px 10px; border: 1px solid #3f3f46; background: #0a0a0a; color: #fafafa; font-family: inherit; font-size: 13.5px; line-height: 1.5"></textarea></label>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-top: 1px solid #2a2a2a">
<button type="button" style="height: 32px; padding: 0 14px; border: 0; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: 13px; font-weight: 700">Choose A</button>
<button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #3f3f46; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 13px">Ask for another option</button>
<span style="margin-left: auto; font-size: 12px; color: #8b8b94">1 / 2 to pick · ⌘↵ to send</span>
</div>
</section>
</div>
</div>

<div style="flex: none; padding: 0 24px 20px">
<div style="max-width: 832px; margin: 0 auto; display: flex; align-items: center; height: 44px; padding: 0 14px; border: 1px solid #2a2a2a; background: #111111; font-size: 13px; color: #8b8b94">Choose an option above, or message the session</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
