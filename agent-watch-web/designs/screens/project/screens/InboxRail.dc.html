<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<title>Collapsed inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Inbox (collapsed)" style="width: 48px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; background: #0c0c0c; border-right: 1px solid #2a2a2a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px">
<button type="button" aria-label="Show inbox ([)" title="Show inbox  [" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #a1a1aa"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16"></rect><path d="M9 4v16M14 10l2 2-2 2"></path></svg></button>
<div style="margin: 4px 0 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #fbbf24">6</div>
<sc-for list="{{items}}" as="i" hint-placeholder-count="6">
<a href="#" title="{{i.title}}" aria-label="{{i.title}}" style="width: 32px; height: 28px; display: flex; align-items: center; justify-content: center; background: {{i.bg}}; outline: 1px solid {{i.ol}}; outline-offset: -1px"><span style="width: 8px; height: 8px; background: {{i.c}}"></span></a>
</sc-for>
<div style="width: 20px; height: 1px; margin: 6px 0; background: #2a2a2a"></div>
<span title="Later 2" style="font-family: 'JetBrains Mono', monospace; color: #a1a1aa">◷2</span>
<span title="In progress 15" style="font-family: 'JetBrains Mono', monospace; color: #60a5fa">15</span>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"int","default":1},"$preview":{"width":48,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.current ?? 1;
    const items = [
      ['PR 2: 配信キューを実装 · Question', '#fbbf24'],
      ['web-app PM · Review', '#fbbf24'],
      ['ログイン後の白い画面を修正 · Error', '#f87171'],
      ['下調べ: キャッシュの効き · Review', '#fbbf24'],
      ['通知の許可ダイアログ · Proposal', '#fbbf24'],
      ['zsh の起動を速くする · Plan', '#52525b']
    ].map(([title, c], i) => ({ title, c, bg: i === cur ? '#262626' : 'transparent', ol: i === cur ? '#a1a1aa' : 'transparent' }));
    return { items };
  }
}
</script>


</body></html>
