<!-- @dsCard group="Conversation" height=380 width=390 subtitle="static rendition" -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>QuestionCard</title>
</head>
<body>
<div class="aw-row">
  <article class="aw-question-card">
    <h2 lang="en">Question</h2>
    <h3>保持期間</h3>
    <p class="aw-question-card__text">検索結果のキャッシュはどのくらい保持しますか?</p>
    <div class="aw-question-card__choices">
      <button class="aw-question-card__choice" type="button" aria-pressed="false"><span class="aw-question-card__choice-content"><span>5 分</span><small>更新の多いインデックス向け</small></span></button>
      <button class="aw-question-card__choice" type="button" aria-pressed="true"><span class="aw-question-card__choice-content"><span>1 時間</span><small>今の更新頻度に合わせる</small></span><span class="aw-question-card__check" aria-hidden="true">✓</span></button>
      <button class="aw-question-card__choice" type="button" aria-pressed="false"><span class="aw-question-card__choice-content"><span>24 時間</span></span></button>
    </div>
    <div class="aw-question-card__actions" lang="en">
      <button class="aw-button aw-button--outline" type="button">No answer (Esc)</button>
      <button class="aw-button aw-button--primary" type="button">Send answers</button>
    </div>
  </article>
</div>
</body>
</html>
