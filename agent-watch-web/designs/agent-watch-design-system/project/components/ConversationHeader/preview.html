<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ConversationHeader</title>
</head>
<body>
<div class="aw-stack">
  <span class="aw-note" lang="en">in progress · 1 task · 2 background tasks</span>
  <header class="aw-mobile-header">
    <button class="aw-mobile-header__back" type="button" aria-label="Back to Inbox"><svg class="aw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="aw-mobile-header__heading">
      <div class="aw-mobile-header__title-row">
        <h1 class="aw-mobile-header__title">検索 API にキャッシュ層を追加する</h1>
        <button class="aw-copy-id" type="button" aria-label="Copy session ID"><svg class="aw-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
      </div>
      <div class="aw-mobile-header__context">
        <div class="aw-task-line"><span class="aw-task-link"><b>P2 #418</b> 検索結果のキャッシュ</span></div>
        <span aria-hidden="true">·</span>
        <span>harbor</span>
      </div>
    </div>
    <button class="aw-mobile-header__status" type="button" aria-label="Open session status panel" aria-expanded="false"><svg class="aw-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/><path d="m10 15-3-3 3-3"/></svg><span>2</span></button>
    <button class="aw-mobile-header__text-button" type="button" lang="en">Later</button>
    <button class="aw-star" type="button" aria-label="Add to Starred" aria-pressed="false">☆</button>
  </header>

  <span class="aw-note" lang="en">done · starred · 3 tasks · 1 background task</span>
  <header class="aw-mobile-header">
    <button class="aw-mobile-header__back" type="button" aria-label="Back to Inbox"><svg class="aw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="aw-mobile-header__heading">
      <div class="aw-mobile-header__title-row">
        <h1 class="aw-mobile-header__title">PR 512: 検索 API のキャッシュ層を追加して応答時間を短縮する</h1>
        <button class="aw-copy-id" type="button" aria-label="Copy session ID"><svg class="aw-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
      </div>
      <div class="aw-mobile-header__context">
        <div class="aw-task-line"><span class="aw-task-link"><b>P2 #418</b> 検索結果のキャッシュ</span><span class="aw-task-more" lang="en">+2 tasks ▾</span></div>
        <span aria-hidden="true">·</span>
        <span>harbor</span>
      </div>
    </div>
    <button class="aw-mobile-header__status" type="button" aria-label="Open session status panel" aria-expanded="false"><svg class="aw-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/><path d="m10 15-3-3 3-3"/></svg><span>1</span></button>
    <button class="aw-mobile-header__text-button" type="button" lang="en">Later</button>
    <button class="aw-mobile-header__text-button" type="button" lang="en">Close</button>
    <button class="aw-star" type="button" aria-label="Remove from Starred" aria-pressed="true">★</button>
  </header>

  <span class="aw-note" lang="en">status panel open</span>
  <header class="aw-mobile-header">
    <button class="aw-mobile-header__back" type="button" aria-label="Back to Inbox"><svg class="aw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="aw-mobile-header__heading">
      <div class="aw-mobile-header__title-row">
        <h1 class="aw-mobile-header__title">検索 API にキャッシュ層を追加する</h1>
        <button class="aw-copy-id" type="button" aria-label="Copy session ID"><svg class="aw-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
      </div>
      <div class="aw-mobile-header__context">
        <div class="aw-task-line"><span class="aw-task-link"><b>P2 #418</b> 検索結果のキャッシュ</span></div>
        <span aria-hidden="true">·</span>
        <span>harbor</span>
      </div>
    </div>
    <button class="aw-mobile-header__status" type="button" aria-label="Close session status panel" aria-expanded="true"><svg class="aw-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/><path d="m8 9 3 3-3 3"/></svg><span>2</span></button>
    <button class="aw-mobile-header__text-button" type="button" lang="en">Later</button>
    <button class="aw-star" type="button" aria-label="Add to Starred" aria-pressed="false">☆</button>
  </header>
</div>
</body>
</html>
